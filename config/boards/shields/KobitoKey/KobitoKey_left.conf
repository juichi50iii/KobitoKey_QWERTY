
CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y



CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_PMW3610=y
